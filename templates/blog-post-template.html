<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{SEO_HEAD}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{CSS_PATH}}">
  <link rel="stylesheet" href="/styles/column-editorial.css?v=20261031-references-1">
  <script src="/scripts/tracking-config.js" defer></script>
  <script src="/scripts/tracking.js" defer></script>

  <link rel="stylesheet" href="/styles/site-chrome.css?v=20261104a">
  <link rel="stylesheet" href="/styles/column-refresh.css?v=20261104a">
  <script src="/scripts/site-chrome.js?v=20261104a" defer></script>
</head>
<body class="article-page">
  {{SITE_HEADER}}
  <main id="main">
    {{PAGE_CONTENT}}
  </main>
  {{SITE_CONTACT}}
  {{SITE_FOOTER}}
  <script>
    (() => {

      const tocLinks = Array.from(document.querySelectorAll('[data-article-toc] a[href^="#"]'));
      const headings = [...new Set(tocLinks
        .map((link) => document.getElementById(decodeURIComponent(link.hash.slice(1))))
        .filter(Boolean))];
      let tocFrame = 0;
      const updateCurrentToc = () => {
        tocFrame = 0;
        if (!headings.length) return;
        const threshold = Math.min(180, window.innerHeight * 0.3);
        let current = headings[0];
        for (const heading of headings) {
          if (heading.getBoundingClientRect().top <= threshold) current = heading;
        }
        tocLinks.forEach((link) => {
          if (link.hash === `#${current.id}`) {
            link.setAttribute('aria-current', 'location');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      };
      const requestTocUpdate = () => {
        if (!tocFrame) tocFrame = window.requestAnimationFrame(updateCurrentToc);
      };
      window.addEventListener('scroll', requestTocUpdate, { passive: true });
      window.addEventListener('resize', requestTocUpdate);
      updateCurrentToc();
    })();
  </script>
</body>
</html>
