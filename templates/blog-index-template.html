<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{SEO_HEAD}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{CSS_PATH}}">
  <script src="/scripts/tracking-config.js" defer></script>
  <script src="/scripts/tracking.js" defer></script>

  <link rel="stylesheet" href="/styles/site-chrome.css?v=20261104a">
  <link rel="stylesheet" href="/styles/column-refresh.css?v=20261104a">
  <script src="/scripts/site-chrome.js?v=20261104a" defer></script>
</head>
<body class="blog-page">
  {{SITE_HEADER}}
  <main id="main">
    {{PAGE_CONTENT}}
  </main>
  {{SITE_CONTACT}}
  {{SITE_FOOTER}}
  <script>
    (() => {

      const filterForm = document.querySelector('[data-blog-filter-form]');
      const searchInput = filterForm?.querySelector('[data-blog-search]');
      const categorySelect = filterForm?.querySelector('[data-blog-category]');
      const symptomSelect = filterForm?.querySelector('[data-blog-symptom]');
      const cards = Array.from(document.querySelectorAll('[data-blog-card]'));
      const resultCount = document.querySelector('[data-blog-result-count]');
      const emptyMessage = document.querySelector('[data-blog-empty]');
      const normalizeText = (value) => String(value || '').normalize('NFKC').toLocaleLowerCase('ja').replace(/\s+/g, '');
      const applyFilters = () => {
        const query = normalizeText(searchInput?.value);
        const category = categorySelect?.value || '';
        const symptom = symptomSelect?.value || '';
        let visibleCount = 0;

        cards.forEach((card) => {
          const matchesQuery = !query || normalizeText(card.dataset.search).includes(query);
          const matchesCategory = !category || card.dataset.category === category;
          const matchesSymptom = !symptom || String(card.dataset.symptoms || '').split(/\s+/).includes(symptom);
          const article = card.closest('.article-list-item');
          const visible = matchesQuery && matchesCategory && matchesSymptom;
          if (article) article.hidden = !visible;
          if (visible) visibleCount += 1;
        });

        if (resultCount) resultCount.textContent = String(visibleCount);
        if (emptyMessage) emptyMessage.hidden = visibleCount !== 0;
      };

      const initialQuery = new URLSearchParams(window.location.search).get('q');
      if (initialQuery && searchInput) searchInput.value = initialQuery;
      filterForm?.addEventListener('submit', (event) => {
        event.preventDefault();
        applyFilters();
      });
      filterForm?.addEventListener('input', applyFilters);
      filterForm?.addEventListener('change', applyFilters);
      // Wait for the browser to restore the form's default values.
      filterForm?.addEventListener('reset', () => requestAnimationFrame(applyFilters));
      applyFilters();
    })();
  </script>
</body>
</html>
