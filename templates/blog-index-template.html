<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{SEO_HEAD}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{CSS_PATH}}">
  <script src="/scripts/tracking-config.js" defer></script>
  <script src="/scripts/tracking.js" defer></script>

</head>
<body class="blog-page">
  <header id="header" class="site-header">
    <div class="site-header__lower">
      <div class="site-header__inner">
        <nav class="site-nav" aria-label="メインナビゲーション">
          <a href="{{HOME_PATH}}#top" class="site-nav__item"><span class="site-nav__jp">ホーム</span><span class="site-nav__en">HOME</span></a>
          <a href="{{HOME_PATH}}#features" class="site-nav__item"><span class="site-nav__jp">当院の特徴</span><span class="site-nav__en">FEATURE</span></a>
          <a href="/symptoms/" class="site-nav__item"><span class="site-nav__jp">症状別</span><span class="site-nav__en">SYMPTOMS</span></a>
          <a href="{{HOME_PATH}}#flow" class="site-nav__item"><span class="site-nav__jp">施術の流れ</span><span class="site-nav__en">FLOW</span></a>
          <a href="{{HOME_PATH}}#price" class="site-nav__item"><span class="site-nav__jp">料金</span><span class="site-nav__en">PRICE</span></a>
          <a href="{{BLOG_PATH}}" class="site-nav__item"><span class="site-nav__jp">コラム</span><span class="site-nav__en">COLUMN</span></a>
          <a href="{{ACCESS_PATH}}" class="site-nav__item site-nav__item--contact"><span class="site-nav__jp">アクセス・予約</span><span class="site-nav__en">ACCESS / CONTACT</span></a>
        </nav>
        <button id="menuBtn" class="site-menu-toggle" type="button" aria-controls="mobileNav" aria-expanded="false" aria-label="メニューを開く">
          <span class="site-menu-toggle__bars" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="site-menu-toggle__text">メニュー</span>
        </button>
        <nav class="site-mobile-nav hidden" id="mobileNav" aria-label="スマートフォン用ナビゲーション">
          <a href="{{HOME_PATH}}#top" class="site-mobile-nav__item">ホーム</a>
          <a href="{{HOME_PATH}}#features" class="site-mobile-nav__item">当院の特徴</a>
          <a href="/symptoms/" class="site-mobile-nav__item">症状別</a>
          <a href="{{HOME_PATH}}#flow" class="site-mobile-nav__item">施術の流れ</a>
          <a href="{{HOME_PATH}}#price" class="site-mobile-nav__item">料金</a>
          <a href="{{BLOG_PATH}}" class="site-mobile-nav__item">コラム</a>
          <a href="{{ACCESS_PATH}}" class="site-mobile-nav__item">アクセス</a>
          <a href="{{CONTACT_PATH}}" class="site-mobile-nav__item site-mobile-nav__item--contact">予約</a>
        </nav>
      </div>
    </div>
  </header>
  <main>
    {{PAGE_CONTENT}}
  </main>
  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <p class="footer-title">柏市の足腰専門整体院 整体院ひざこぞう</p>
        <p class="footer-text">千葉県柏市｜腰痛・坐骨神経痛・股関節痛・膝痛など足腰の慢性痛相談</p>
      </div>
      <div class="footer-links">
        <a href="{{HOME_PATH}}">トップへ戻る</a>
        <a href="{{BLOG_PATH}}">ブログ一覧</a>
        <a href="{{CONTACT_PATH}}">LINEで相談する</a>
      </div>
    </div>
  </footer>
  <script>
    (() => {
      const menuBtn = document.getElementById('menuBtn');
      const mobileNav = document.getElementById('mobileNav');
      const setMenuState = (open) => {
        mobileNav?.classList.toggle('hidden', !open);
        menuBtn?.setAttribute('aria-expanded', String(open));
        menuBtn?.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
      };
      setMenuState(false);
      menuBtn?.addEventListener('click', () => setMenuState(mobileNav?.classList.contains('hidden')));
      mobileNav?.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenuState(false)));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') setMenuState(false);
      });

      const filterForm = document.querySelector('[data-blog-filter-form]');
      const searchInput = filterForm?.querySelector('[data-blog-search]');
      const categorySelect = filterForm?.querySelector('[data-blog-category]');
      const symptomSelect = filterForm?.querySelector('[data-blog-symptom]');
      const cards = Array.from(document.querySelectorAll('[data-blog-card]'));
      const resultCount = document.querySelector('[data-blog-result-count]');
      const emptyMessage = document.querySelector('[data-blog-empty]');
      const normalizeText = (value) => String(value || '').normalize('NFKC').toLocaleLowerCase('ja').replace(/\s+/g, '');
      const applyFilters = () => {
        const query = normalizeText(searchInput?.value);
        const category = categorySelect?.value || '';
        const symptom = symptomSelect?.value || '';
        let visibleCount = 0;

        cards.forEach((card) => {
          const matchesQuery = !query || normalizeText(card.dataset.search).includes(query);
          const matchesCategory = !category || card.dataset.category === category;
          const matchesSymptom = !symptom || String(card.dataset.symptoms || '').split(/\s+/).includes(symptom);
          const article = card.closest('.article-list-item');
          const visible = matchesQuery && matchesCategory && matchesSymptom;
          if (article) article.hidden = !visible;
          if (visible) visibleCount += 1;
        });

        if (resultCount) resultCount.textContent = String(visibleCount);
        if (emptyMessage) emptyMessage.hidden = visibleCount !== 0;
      };

      const initialQuery = new URLSearchParams(window.location.search).get('q');
      if (initialQuery && searchInput) searchInput.value = initialQuery;
      filterForm?.addEventListener('submit', (event) => {
        event.preventDefault();
        applyFilters();
      });
      filterForm?.addEventListener('input', applyFilters);
      filterForm?.addEventListener('change', applyFilters);
      filterForm?.addEventListener('reset', () => queueMicrotask(applyFilters));
      applyFilters();
    })();
  </script>
</body>
</html>
